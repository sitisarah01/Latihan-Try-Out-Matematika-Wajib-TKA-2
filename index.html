<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Try Out MTK Wajib 2</title>
<style>
:root{--bg:#f4f6fb;--c:#fff;--t:#1d2433;--m:#64708a;--p:#2f5bea;--pl:#e6ecff;--ok:#16a34a;--okl:#dcfce7;--no:#dc2626;--nol:#fee2e2;--b:#d9dfec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1420;--c:#182033;--t:#e8ecf6;--m:#98a3bd;--p:#7c9bff;--pl:#22305a;--ok:#4ade80;--okl:#12341f;--no:#f87171;--nol:#3d1a1a;--b:#2b3652}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.55 system-ui,Segoe UI,Roboto,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:20px;margin-bottom:14px}
h1{font-size:26px;line-height:1.2;margin:0 0 6px;text-align:center;color:var(--p)}h2{font-size:18px;margin:0 0 10px}.sub{text-align:center;color:var(--m);margin:0 0 18px}
label{display:block;font-weight:600;margin:12px 0 4px}input{width:100%;padding:11px 12px;border:1px solid var(--b);border-radius:10px;background:var(--bg);color:var(--t);font:inherit}
.btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:12px 20px;font:600 16px inherit;cursor:pointer}.btn.g{background:var(--pl);color:var(--p)}.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}.chip{display:inline-block;background:var(--pl);color:var(--p);border-radius:20px;padding:2px 10px;font-size:13px;font-weight:600}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--b);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}.opt.s{border-color:var(--p);background:var(--pl)}.opt input{width:auto;margin-top:5px}
table{width:100%;border-collapse:collapse;margin:8px 0}td,th{border:1px solid var(--b);padding:8px;font-size:15px}th{background:var(--pl)}td.c{text-align:center;width:70px}
.fig{text-align:center;margin:10px 0}.fig svg{max-width:100%;height:auto}svg text{fill:var(--t);font:12px sans-serif}
.nav{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-top:10px}.nav button{padding:7px 0;border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:8px;cursor:pointer;font:600 13px inherit}.nav .d{background:var(--pl);border-color:var(--p)}.nav .cur{outline:2px solid var(--p)}
.bar{height:8px;background:var(--b);border-radius:8px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--p)}
.sc{font-size:56px;font-weight:800;text-align:center;color:var(--p);line-height:1}.rv{border-left:5px solid var(--b)}.rv.ok{border-color:var(--ok)}.rv.no{border-color:var(--no)}
.key{background:var(--okl);border-radius:10px;padding:10px;margin:8px 0}.exp{background:var(--pl);border-radius:10px;padding:10px;margin:8px 0}.bad{background:var(--nol);border-radius:10px;padding:10px;margin:8px 0}.hide{display:none}
.hero{background:linear-gradient(135deg,#1e6be0,#0a3a8c);color:#fff;border-radius:20px 20px 0 0;padding:28px 20px;text-align:center}.hero .tag{display:inline-block;background:rgba(255,255,255,.2);border-radius:20px;padding:6px 16px;font-size:14px;margin-bottom:14px}.hero h1{color:#fff;font-size:30px;margin:0}
.front{background:var(--c);border:1px solid var(--b);border-radius:0 0 20px 20px;padding:20px;margin-bottom:14px}.meta{font-size:19px;font-weight:700;display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px}.front p{color:var(--m)}
.kisi th{color:var(--m);text-align:left;background:none;border:0;border-bottom:2px solid var(--b)}.kisi td{border:0;border-bottom:1px solid var(--b);padding:10px 6px}.kisi td:last-child,.kisi th:last-child{text-align:center}
.tm{position:sticky;top:0;z-index:5;background:var(--p);color:#fff;border-radius:0 0 12px 12px;padding:8px 14px;display:flex;justify-content:space-between;font-weight:700;margin-bottom:12px}
.st{display:flex;gap:10px;margin:8px 0;align-items:flex-start}.st b{flex:none;background:var(--p);color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:13px}.kt td{text-align:center;padding:4px;font-size:13px}
details{margin:8px 0}summary{cursor:pointer;color:var(--p);font-weight:600}
@media print{.btn,.nav{display:none}}
</style></head><body><div class="w" id="app"></div>
<script>
const $=s=>document.querySelector(s),A=$('#app');
const hist=(v,l)=>{let s='<svg viewBox="0 0 330 190" width="330"><path d="M30 10V160H320" stroke="currentColor" fill="none" stroke-width="1.5"/>';v.forEach((h,i)=>{s+=`<rect x="${30+i*45}" y="${160-h*9}" width="45" height="${h*9}" fill="#8aa4f0" stroke="#333"/><text x="${i*45+24}" y="176">${l[i]}</text><text x="8" y="${164-h*9}" style="font-size:10px">${h}</text>`});return s+'</svg>'};
const Q=[
{k:'Bilangan',q:'Hasil dari operasi hitung 99 − 15 × (−7) + 148 : 4 − 76 adalah ....',t:'mc',o:['−75','105','165','175','195'],a:2,e:'Kerjakan perkalian dan pembagian dulu: 15 × (−7) = −105 dan 148 : 4 = 37. Maka 99 − (−105) + 37 − 76 = 99 + 105 + 37 − 76 = 165.'},
{k:'Pecahan & Persen',q:'Pak Jayadi memiliki kebun seluas 4 ha yang ditanami ubi, pisang, mangga, dan jambu. Luas ubi ¾ ha, pisang 1½ ha, mangga 40% dari luas lahan, sisanya jambu. Berilah tanda centang pada pernyataan yang benar! (Jawaban dapat lebih dari satu)',t:'multi',o:['Kebun untuk tanaman ubi lebih luas dari mangga.','Kebun untuk tanaman pisang lebih luas dari mangga.','Luas kebun untuk tanaman jambu kurang dari 0,5 ha.','Kebun untuk tanaman ubi lebih luas dari jambu.','Kebun untuk tanaman mangga lebih luas dari jambu.'],a:[2,3,4],e:'Mangga = 40% × 4 = 1,6 ha. Jambu = 4 − (0,75 + 1,5 + 1,6) = 0,15 ha. (1) 0,75 < 1,6 → salah. (2) 1,5 < 1,6 → salah. (3) 0,15 < 0,5 → benar. (4) 0,75 > 0,15 → benar. (5) 1,6 > 0,15 → benar.'},
{k:'Bentuk Akar',q:'Beri tanda centang pada kolom Benar atau Salah sesuai dengan operasi bilangan berikut!',t:'tf',h:['Benar','Salah'],o:['8√5 + 7√5 − √125 = 10√5','12√5 − √80 + 6√5 = 14√5','√125 − 2√5 + 9√5 = 12√5','7√5 + 10√5 − √45 = 8√5','9√5 − √20 + 2√5 = 7√5'],a:[0,0,0,1,1],e:'Sederhanakan: √125 = 5√5, √80 = 4√5, √45 = 3√5, √20 = 2√5. (1) 8+7−5 = 10 → benar. (2) 12−4+6 = 14 → benar. (3) 5−2+9 = 12 → benar. (4) 7+10−3 = 14√5 ≠ 8√5 → salah. (5) 9−2+2 = 9√5 ≠ 7√5 → salah.'},
{k:'SPLDV',q:'Doni membeli 1 roti dan 4 kue dengan membayar Rp6.500,00. Andika membeli 2 roti dan 1 kue dengan membayar Rp6.000,00. Berilah tanda centang pada jawaban yang benar! (Jawaban dapat lebih dari satu)',t:'multi',o:['Harga 3 roti adalah Rp7.500,00','Harga 3 kue adalah Rp6.000,00','Harga 4 roti adalah Rp8.000,00','Harga 4 kue adalah Rp4.000,00','Harga 1 roti dan 1 kue adalah Rp3.500,00'],a:[0,3,4],e:'Misal roti = r, kue = k. r + 4k = 6.500 dan 2r + k = 6.000. Kalikan persamaan pertama dengan 2: 2r + 8k = 13.000. Kurangkan: 7k = 7.000 → k = 1.000, r = 2.500. 3 roti = 7.500 (benar); 3 kue = 3.000 (salah); 4 roti = 10.000 (salah); 4 kue = 4.000 (benar); 1 roti + 1 kue = 3.500 (benar).'},
{k:'SPLTV',q:'Diketahui sistem persamaan linear 3x − y + z = 10; 2x + 3y − z = 8; x + y − 2z = −10. Nilai (1/x + 1/y + 1/z) yang memenuhi sistem persamaan linear tersebut adalah ....',t:'mc',o:['1/8','5/8','7/8','3/4','1/4'],a:2,e:'Jumlahkan persamaan (1) dan (2): 5x + 2y = 18. Kalikan (1) dengan 2 lalu jumlahkan dengan (3): 7x − y = 10 → y = 7x − 10. Substitusi: 5x + 14x − 20 = 18 → x = 2, y = 4. Dari (1): 6 − 4 + z = 10 → z = 8. Maka 1/2 + 1/4 + 1/8 = 4/8 + 2/8 + 1/8 = 7/8.'},
{k:'SPL (Cerita)',q:'Bu Intan membeli 4 kg beras, 5 kg gula, dan 6 kg tepung terigu. Bu Hasih membeli 5 kg beras, 3 kg gula, dan 4 kg tepung terigu. Bu Mira membeli 6 kg beras, 2 kg gula, dan 7 kg tepung terigu. Bu Intan membayar Rp161.000,00, Bu Hasih Rp124.000,00, dan Bu Mira Rp150.000,00. Berdasarkan informasi tersebut, harga 5 kg gula adalah ....',t:'mc',o:['Rp55.000,00','Rp60.000,00','Rp65.000,00','Rp70.000,00','Rp75.000,00'],a:2,e:'Misal beras = b, gula = g, tepung = t (dalam ribuan). 4b+5g+6t = 161; 5b+3g+4t = 124; 6b+2g+7t = 150. Dengan eliminasi diperoleh b = 9, g = 13, t = 10 (cek persamaan 3: 54 + 26 + 70 = 150 ✓). Harga 5 kg gula = 5 × 13.000 = Rp65.000,00.'},
{k:'Pertidaksamaan Linear',q:'Daerah yang diarsir pada gambar adalah himpunan semua (x, y) yang memenuhi ....',t:'mc',fig:'<svg viewBox="0 0 230 170" width="260"><path d="M30 150V10M30 140H210" stroke="currentColor" fill="none" stroke-width="1.5"/><polygon points="30,140 105,140 90,116 30,80" fill="#8aa4f0" opacity=".6"/><path d="M30 20L105 140M30 80L130 140" stroke="currentColor" fill="none" stroke-width="1.5"/><text x="6" y="24">30</text><text x="6" y="84">15</text><text x="98" y="156">15</text><text x="124" y="156">20</text></svg>',o:['2x + y ≤ 30, 3x + 4y ≤ 60, x ≥ 0, y ≥ 0','2x + y ≤ 30, 3x + 4y ≥ 60, x ≥ 0, y ≥ 0','x + 2y ≤ 30, 3x + 4y ≥ 60, x ≥ 0, y ≥ 0','x + 2y ≤ 30, 3x + 4y ≤ 60, x ≥ 0, y ≥ 0','2x + y ≥ 30, 3x + 4y ≤ 60, x ≥ 0, y ≥ 0'],a:0,e:'Garis pertama memotong sumbu y di 30 dan sumbu x di 15 → 30x + 15y = 450 → 2x + y = 30. Garis kedua memotong sumbu y di 15 dan sumbu x di 20 → 15x + 20y = 300 → 3x + 4y = 60. Daerah arsiran berada di bawah kedua garis (menuju titik asal) di kuadran I, sehingga 2x + y ≤ 30, 3x + 4y ≤ 60, x ≥ 0, y ≥ 0. (Catatan: gambar arsiran di atas hanya ilustrasi.)'},
{k:'Fungsi Kuadrat',q:'Perhatikan grafik fungsi berikut ini! Daerah hasil dari fungsi di atas adalah ....',t:'mc',fig:'<svg viewBox="0 0 240 180" width="260"><path d="M40 170V10M20 150H230" stroke="currentColor" fill="none" stroke-width="1.5"/><path d="M80 20Q120 240 160 20" stroke="#2f5bea" fill="none" stroke-width="2.5"/><path d="M40 130H120V150" stroke="currentColor" stroke-dasharray="4" fill="none"/><text x="26" y="134">1</text><text x="116" y="164">4</text><text x="24" y="14">y</text><text x="222" y="165">x</text></svg>',o:['{y | y > 1, y ∈ R}','{y | y ≥ 1, y ∈ R}','{y | y > 4, y ∈ R}','{y | y ≥ 4, y ∈ R}','{y | 1 ≤ y ≤ 4, y ∈ R}'],a:1,e:'Grafik berbentuk parabola terbuka ke atas dengan titik balik (puncak/minimum) di (4, 1). Nilai y terkecil adalah 1 dan titik tersebut termasuk grafik, sehingga daerah hasilnya {y | y ≥ 1, y ∈ R}.'},
{k:'Fungsi Invers',q:'Berilah tanda centang pada jawaban yang benar sesuai nilai fungsi invers dari f(x) = (x + 11)/(7x − 22)! (Jawaban dapat lebih dari satu)',t:'multi',o:['Nilai f⁻¹(0) = −11','Nilai f⁻¹(1) = 11/2','Nilai f⁻¹(2) = 55/13','Nilai f⁻¹(3) = 77/13','Nilai f⁻¹(4) = 22/3'],a:[0,1,2],e:'Cari invers: y = (x+11)/(7x−22) → 7xy − 22y = x + 11 → x(7y − 1) = 22y + 11 → f⁻¹(x) = (22x + 11)/(7x − 1). f⁻¹(0) = −11 ✓; f⁻¹(1) = 33/6 = 11/2 ✓; f⁻¹(2) = 55/13 ✓; f⁻¹(3) = 77/20 ≠ 77/13 ✗; f⁻¹(4) = 99/27 = 11/3 ≠ 22/3 ✗.'},
{k:'Fungsi Komposisi',q:'Diketahui f(x) = x − 4, g(x) = 3x + 5, dan h(x) = x² − 3. Beri tanda centang pada kolom Setuju atau Tidak Setuju sesuai dengan teks tersebut!',t:'tf',h:['Setuju','Tidak Setuju'],o:['(f ∘ g)(x) = 3x + 1','(f ∘ h)(x) = x² − 9','(g ∘ f)(x) = 3x − 4','(g ∘ h)(x) = 3x² − 4','(f ∘ g ∘ h)(x) = 3x² − 8'],a:[0,1,1,0,0],e:'(f∘g)(x) = (3x+5) − 4 = 3x + 1 → setuju. (f∘h)(x) = (x²−3) − 4 = x² − 7 → tidak setuju. (g∘f)(x) = 3(x−4) + 5 = 3x − 7 → tidak setuju. (g∘h)(x) = 3(x²−3) + 5 = 3x² − 4 → setuju. (f∘g∘h)(x) = (3x² − 4) − 4 = 3x² − 8 → setuju.'},
{k:'Deret Aritmetika',q:'Diketahui deret bilangan 10 + 12 + 14 + 16 + ... + 98. Jumlah bilangan dari deret bilangan yang habis dibagi 2 tetapi tidak habis dibagi 5 adalah ....',t:'mc',o:['1.380','1.500','1.980','3.300','4.400'],a:2,e:'Banyak suku: n = (98 − 10)/2 + 1 = 45, jumlah seluruhnya = 45/2 × (10 + 98) = 2.430. Bilangan yang habis dibagi 5 pada deret ini adalah 10, 20, ..., 90 (9 suku), jumlahnya 9/2 × (10 + 90) = 450. Jadi jumlah yang diminta = 2.430 − 450 = 1.980.'},
{k:'Barisan Geometri',q:'Terdapat barisan geometri. Jumlah dua suku pertama barisan tersebut adalah 8. Adapun suku ketiga barisan tersebut adalah 18. Suku-suku barisan tersebut merupakan bilangan positif. Berdasarkan informasi tersebut, suku keempat barisan tersebut adalah ....',t:'mc',o:['9','12','18','27','54'],a:4,e:'a + ar = 8 dan ar² = 18. Bagi: r²/(1 + r) = 18/8 = 9/4 → 4r² − 9r − 9 = 0 → (4r + 3)(r − 3) = 0 → r = 3 (positif). Maka a = 18/9 = 2, dan U₄ = ar³ = 2 × 27 = 54.'},
{k:'Bunga Majemuk',q:'Modal sebesar Rp6.000.000,00 disimpan di bank. Bank memberikan bunga majemuk 10%/tahun. Beri tanda centang pada kolom Benar atau Salah!',t:'tf',h:['Benar','Salah'],o:['Besar uang simpanan selama 2 tahun adalah Rp7.260.000,00.','Besar uang simpanan selama 3 tahun adalah Rp7.986.000,00.','Besar uang simpanan selama 4 tahun adalah Rp8.784.600,00.','Besar uang simpanan selama 5 tahun adalah Rp9.702.600,00.','Besar uang simpanan selama 6 tahun adalah Rp11.260.486,00.'],a:[0,0,0,1,1],e:'Mₙ = 6.000.000 × (1,1)ⁿ. n=2: ×1,21 = 7.260.000 ✓. n=3: ×1,331 = 7.986.000 ✓. n=4: ×1,4641 = 8.784.600 ✓. n=5: ×1,61051 = 9.663.060 (bukan 9.702.600) ✗. n=6: ×1,771561 = 10.629.366 (bukan 11.260.486) ✗.'},
{k:'Kesebangunan',q:'Pada gambar, BE sejajar CD. Jika panjang AB = 10 cm, AC = 18 cm, AE = 12 cm. Panjang DE adalah ... cm.',t:'mc',fig:'<svg viewBox="0 0 220 150" width="260"><polygon points="100,10 20,130 190,130" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M56,77H150" stroke="currentColor" stroke-width="1.5"/><text x="96" y="8">A</text><text x="40" y="82">B</text><text x="154" y="80">E</text><text x="6" y="140">C</text><text x="194" y="140">D</text></svg>',o:['7,8','8,4','9,6','9,8','10,2'],a:2,e:'Karena BE ∥ CD, segitiga ABE sebangun dengan ACD: AB/AC = AE/AD → 10/18 = 12/AD → AD = 21,6 cm. Maka DE = AD − AE = 21,6 − 12 = 9,6 cm.'},
{k:'Teorema Pythagoras',q:'Segitiga KLM siku-siku di K. Jika panjang KL = 16 cm dan LM = 32 cm, panjang KM adalah ....',t:'mc',o:['16√2','16√3','18√2','18√3','18√6'],a:1,e:'Siku-siku di K berarti LM adalah sisi miring. KM² = LM² − KL² = 1.024 − 256 = 768 = 256 × 3. Jadi KM = 16√3 cm.'},
{k:'Transformasi (Translasi)',q:'Hasil translasi titik Q(21, −12) oleh T = (6, 10) adalah ....',t:'mc',o:['Q′(27, −6)','Q′(27, −4)','Q′(27, −2)','Q′(28, 2)','Q′(27, 8)'],a:2,e:'Q′ = (21 + 6, −12 + 10) = (27, −2).'},
{k:'Transformasi (Komposisi)',q:'Hasil transformasi titik R(16, 3) ditranslasikan oleh T₁ = (2, 5) dilanjutkan dengan T₂ = (0, 2) adalah ....',t:'mc',o:['R′(16, 8)','R′(16, 10)','R′(18, 8)','R′(18, 10)','R′(18, 12)'],a:3,e:'Translasi berurutan = jumlah vektor: T₁ + T₂ = (2 + 0, 5 + 2) = (2, 7). R′ = (16 + 2, 3 + 7) = (18, 10).'},
{k:'Bangun Datar',q:'Diketahui bangun belah ketupat ABCD dengan panjang AB = 15 cm dan OB = 9 cm (O titik potong diagonal). Berilah tanda centang pada pernyataan yang benar! (Jawaban dapat lebih dari satu)',t:'multi',fig:'<svg viewBox="0 0 200 190" width="200"><polygon points="100,10 40,95 100,180 160,95" fill="#8aa4f0" opacity=".5" stroke="currentColor" stroke-width="1.5"/><path d="M100 10V180M40 95H160" stroke="currentColor" stroke-dasharray="4"/><text x="96" y="8">A</text><text x="24" y="99">B</text><text x="96" y="192">C</text><text x="164" y="99">D</text><text x="104" y="92">O</text></svg>',o:['Keliling bangun ABCD adalah 60 cm.','Luas segitiga AOB adalah 68 cm².','Luas segitiga BOC adalah 54 cm².','Panjang diagonal AC adalah 24 cm.','Luas layang-layang adalah 216 cm².'],a:[0,2,3,4],e:'Segitiga AOB siku-siku di O: AO = √(15² − 9²) = √144 = 12 cm. Belah ketupat: keempat sisi 15 cm → keliling = 60 ✓. Luas AOB = ½ × 9 × 12 = 54 (bukan 68) ✗. Luas BOC = ½ × 9 × 12 = 54 ✓. AC = 2 × 12 = 24 ✓. BD = 18, luas = ½ × 24 × 18 = 216 ✓.'},
{k:'Trigonometri',q:'Bambu sepanjang 6 m disandarkan pada pagar. Tinggi pagar 2 m. Nilai sinus sudut pangkal bambu dengan tanah adalah ....',t:'mc',o:['1/12','1/6','1/3','√10/20','√10/10'],a:2,e:'Bambu menjadi sisi miring (6 m), dan tinggi pagar menjadi sisi depan sudut (2 m). sin θ = depan/miring = 2/6 = 1/3.'},
{k:'Trigonometri (Kuadran)',q:'Diketahui sin A = 4/5. Jika sudut A di kuadran II. Beri tanda centang pada kolom benar atau salah!',t:'tf',h:['Benar','Salah'],o:['Nilai dari cos A = 3/5.','Nilai dari tan A = −4/3.','Nilai dari 3 cos A = 9/5.','Nilai dari 3 tan A = −4.','Nilai dari cosecan A adalah −5/3.'],a:[1,0,1,0,1],e:'sin A = 4/5 → sisi samping = 3 (segitiga 3-4-5). Di kuadran II cos negatif: cos A = −3/5 (pernyataan 1 salah), tan A = −4/3 (benar). 3 cos A = −9/5 (salah). 3 tan A = −4 (benar). cosec A = 1/sin A = 5/4 (bukan −5/3, salah).'},
{k:'Statistika (Modus)',q:'Perhatikan histogram berikut! Modus dari data pada histogram di atas adalah ....',t:'mc',fig:hist([4,6,8,15,10,2],['30,5','40,5','50,5','60,5','70,5','80,5']),o:['62,33','66,33','67,67','68,13','68,67'],a:1,e:'Kelas modus adalah kelas dengan frekuensi terbesar (15) → 60,5 – 70,5. Tepi bawah L = 60,5; d₁ = 15 − 8 = 7; d₂ = 15 − 10 = 5; p = 10. Mo = 60,5 + (7/(7+5)) × 10 = 60,5 + 5,83 = 66,33.'},
{k:'Statistika (Ragam)',q:'Diketahui data tinggi badan suatu komunitas: 160–164 (frekuensi 6), 165–169 (12), 170–174 (20), 175–179 (2). Ragam dari data tinggi badan tersebut adalah ....',t:'mc',o:['14,24','14,32','15,64','16,19','20,42'],a:3,e:'Titik tengah: 162, 167, 172, 177 dengan n = 40. Rata-rata = (6·162 + 12·167 + 20·172 + 2·177)/40 = 6.770/40 = 169,25. Ragam = Σf(x − x̄)²/n = (6·52,5625 + 12·5,0625 + 20·7,5625 + 2·60,0625)/40 = 647,5/40 ≈ 16,19.'},
{k:'Kaidah Pencacahan',q:'Perhatikan gambar jalur! Banyak cara yang dapat ditempuh dalam perjalanan dari kota A ke kota D adalah ... cara.',t:'mc',fig:'<svg viewBox="0 0 330 190" width="330"><g stroke="currentColor" fill="none" stroke-width="1.5"><path d="M20 70L90 35H190M20 70L70 100H180M70 100L170 130H250M170 130L230 165"/></g><text x="6" y="74">A</text><text x="50" y="28">6 jalur</text><text x="190" y="32">H</text><text x="140" y="30">8 jalur</text><text x="30" y="92">5 jalur</text><text x="58" y="118">B</text><text x="180" y="98">F</text><text x="125" y="92">4 jalur</text><text x="85" y="132">6 jalur</text><text x="160" y="150">C</text><text x="205" y="124">5 jalur</text><text x="254" y="134">D</text><text x="215" y="162">4 jalur</text></svg>',o:['120','150','160','180','240'],a:1,e:'Jalur dari A ke D harus melewati B lalu C: A → B (5 jalur), B → C (6 jalur), C → D (5 jalur). Dengan aturan perkalian: 5 × 6 × 5 = 150 cara. (Jalur ke G, H, F, dan E tidak mengarah ke D.)'},
{k:'Permutasi',q:'Suatu kelompok yang terdiri dari 12 orang akan dipilih 3 orang sebagai ketua, wakil ketua, dan sekretaris. Banyak cara pemilihan adalah ....',t:'mc',o:['120','720','1.320','1.640','2.480'],a:2,e:'Jabatan berbeda sehingga urutan diperhatikan (permutasi): ₁₂P₃ = 12 × 11 × 10 = 1.320.'},
{k:'Peluang',q:'Di dalam kantong terdapat 4 macam kelereng: putih 4 butir, kuning 2 butir, biru 2 butir, dan ungu 6 butir. Seseorang akan mengambil satu kelereng secara acak. Beri tanda centang pada kolom Setuju atau Tidak Setuju!',t:'tf',h:['Setuju','Tidak Setuju'],o:['Peluang terambil kelereng putih adalah 2/7.','Peluang terambil kelereng kuning adalah 1/7.','Peluang terambil kelereng biru adalah 1/7.','Peluang terambil bukan kelereng putih adalah 6/7.','Peluang terambil bukan kelereng kuning adalah 13/14.'],a:[0,0,0,1,1],e:'Total kelereng = 4 + 2 + 2 + 6 = 14. P(putih) = 4/14 = 2/7 ✓. P(kuning) = 2/14 = 1/7 ✓. P(biru) = 2/14 = 1/7 ✓. P(bukan putih) = 10/14 = 5/7 (bukan 6/7) ✗. P(bukan kuning) = 12/14 = 6/7 (bukan 13/14) ✗.'}
];
const N=Q.length;
const TP=[['Bilangan & Bentuk Akar',[1,3]],['Aritmetika Sosial',[2,13]],['SPL & Program Linear',[4,5,6,7]],['Fungsi',[8,9,10]],['Barisan & Deret',[11,12]],['Geometri & Transformasi',[14,15,16,17,18]],['Trigonometri',[19,20]],['Statistika',[21,22]],['Peluang & Pencacahan',[23,24,25]]];
let U={},i=0,ans=[],tl=5400,tid=null,rep='';const L='ABCDE';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function start(){clearInterval(tid);A.innerHTML=`<div class="hero"><div class="tag">TKA 2026 · SMA/MA dan SMK/MAK</div><h1>TRY OUT MTK WAJIB 2</h1></div><div class="front"><div class="meta"><span>📝 ${N} soal</span><span>⏱ 90 menit</span><span>📚 ${TP.length} topik materi</span></div>
<p>Jenis soal: pilihan ganda, pilihan ganda kompleks (centang lebih dari satu), dan tabel Benar/Salah. Soal pilihan ganda kompleks dan tabel dinilai benar jika <b>semua</b> pilihan tepat. Setelah selesai tersedia skor, kunci jawaban, dan pembahasan langkah demi langkah. Skor dapat diunduh. Try out ini dapat dikerjakan berulang kali.</p>
<h2 style="font-size:22px">Data peserta</h2><label>Nama lengkap</label><input id="nm" autocomplete="off"><label>Kelas</label><input id="kl" autocomplete="off"><label>Asal sekolah</label><input id="sk" autocomplete="off">
<button class="btn" style="width:100%;margin-top:18px" onclick="go()">Mulai Try Out</button></div>
<div class="card"><h2 style="font-size:24px">Kisi-kisi soal</h2><table class="kisi"><tr><th>Topik materi</th><th>Nomor soal</th><th>Jumlah</th></tr>${TP.map(t=>`<tr><td>${t[0]}</td><td>${t[1].join(', ')}</td><td>${t[1].length}</td></tr>`).join('')}<tr><td><b>Total</b></td><td></td><td><b>${N}</b></td></tr></table></div>`;scrollTo(0,0)}
function go(){U={n:$('#nm').value.trim(),k:$('#kl').value.trim(),s:$('#sk').value.trim()};if(!U.n||!U.k||!U.s)return alert('Lengkapi Nama, Kelas, dan Asal Sekolah dulu.');i=0;tl=5400;ans=Q.map(q=>q.t=='multi'?[]:q.t=='tf'?q.o.map(()=>null):null);clearInterval(tid);tid=setInterval(()=>{tl--;const t=$('#tt');if(t)t.textContent=fmt(tl);if(tl<=0){clearInterval(tid);alert('Waktu habis! Jawaban dikumpulkan otomatis.');res()}},1000);quiz()}
const fmt=x=>String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');
const has=j=>{const a=ans[j],q=Q[j];return q.t=='mc'?a!==null:q.t=='multi'?a.length>0:a.some(x=>x!==null)};
function quiz(){const q=Q[i],a=ans[i],dn=Q.filter((_,j)=>has(j)).length;let h=`<div class="tm"><span>⏱ Sisa waktu</span><span id="tt">${fmt(tl)}</span></div><div class="card"><div class="row"><span class="chip">Soal ${i+1}/${N} · ${q.k}</span><span style="color:var(--m);font-size:14px">${esc(U.n)}</span></div><div class="bar"><i style="width:${dn/N*100}%"></i></div><p>${q.q}</p>${q.fig?`<div class="fig">${q.fig}</div>`:''}`;
if(q.t=='mc')h+=q.o.map((o,j)=>`<div class="opt ${a===j?'s':''}" onclick="pick(${j})"><b>${L[j]}.</b><span>${o}</span></div>`).join('');
else if(q.t=='multi')h+=q.o.map((o,j)=>`<div class="opt ${a.includes(j)?'s':''}" onclick="pick(${j})"><input type="checkbox" ${a.includes(j)?'checked':''} tabindex="-1"><span>${o}</span></div>`).join('');
else h+=`<table><tr><th>Pernyataan</th><th>${q.h[0]}</th><th>${q.h[1]}</th></tr>${q.o.map((o,j)=>`<tr><td>${o}</td>${[0,1].map(c=>`<td class="c"><input type="radio" name="r${j}" ${a[j]===c?'checked':''} onclick="pick(${j},${c})"></td>`).join('')}</tr>`).join('')}</table>`;
h+=`<div class="row" style="margin-top:14px"><button class="btn g" onclick="mv(-1)" ${i?'':'disabled'}>← Sebelumnya</button>${i<N-1?`<button class="btn" onclick="mv(1)">Berikutnya →</button>`:`<button class="btn" onclick="fin()">Selesai &amp; Lihat Hasil</button>`}</div></div><div class="card"><h2>Navigasi Soal</h2><div class="nav">${Q.map((_,j)=>`<button class="${has(j)?'d':''} ${j==i?'cur':''}" onclick="i=${j};quiz()">${j+1}</button>`).join('')}</div><div style="margin-top:12px;text-align:right"><button class="btn g" onclick="fin()">Kumpulkan Jawaban</button></div></div>`;A.innerHTML=h;scrollTo(0,0)}
function pick(j,c){const q=Q[i];if(q.t=='mc')ans[i]=j;else if(q.t=='multi'){const a=ans[i],k=a.indexOf(j);k<0?a.push(j):a.splice(k,1)}else ans[i][j]=c;quiz()}
function mv(d){i+=d;quiz()}
const ok=j=>{const q=Q[j],a=ans[j];return q.t=='mc'?a===q.a:q.t=='multi'?[...a].sort().join()==q.a.join():a.every((x,k)=>x===q.a[k])};
const txt=(q,a)=>q.t=='mc'?(a===null?'(tidak dijawab)':L[a]+'. '+q.o[a]):q.t=='multi'?(a.length?'Nomor '+[...a].sort().map(j=>j+1).join(', '):'(tidak dijawab)'):q.o.map((_,j)=>(j+1)+': '+(a[j]===null?'—':q.h[a[j]])).join(' · ');
const key=q=>q.t=='mc'?L[q.a]+'. '+q.o[q.a]:q.t=='multi'?'Pernyataan nomor '+q.a.map(j=>j+1).join(', '):q.o.map((_,j)=>(j+1)+': '+q.h[q.a[j]]).join(' · ');
const stp=e=>e.split(/(?<=\.)\s+(?=[A-Z(√\d])/);
const sh=e=>stp(e).map((x,k)=>`<div class="st"><b>${k+1}</b><span>${x}</span></div>`).join('');
function fin(){const un=Q.filter((_,j)=>!has(j)).length;if(un&&!confirm(un+' soal belum dijawab. Tetap kumpulkan?'))return;res()}
function res(){clearInterval(tid);const s=Q.filter((_,j)=>ok(j)).length,n=Math.round(s/N*100),pr=n>=80?'Sangat baik! 🎉':n>=60?'Baik, terus tingkatkan! 👍':'Ayo belajar lagi, kamu pasti bisa! 💪';
let h=`<div class="card"><h1>Hasil Try Out MTK Wajib 2</h1><p class="sub">${esc(U.n)} · ${esc(U.k)} · ${esc(U.s)}</p><div class="sc">${n}</div><p class="sub">Benar ${s} dari ${N} soal · Salah/kosong ${N-s}<br><b>${pr}</b></p><div class="row"><button class="btn" onclick="dl('html')">⬇ Unduh Skor &amp; Pembahasan</button><button class="btn g" onclick="dl('csv')">⬇ Unduh CSV</button><button class="btn g" onclick="start()">Ulangi</button></div><p id="dm" class="sub"></p></div>
<div class="card"><h2>Kunci Jawaban</h2><table class="kt"><tr>${Q.map((q,j)=>`<td>${j+1}<br><b style="color:var(${ok(j)?'--ok':'--no'})">${q.t=='mc'?L[q.a]:q.t=='multi'?q.a.map(x=>x+1).join(','):q.a.map(x=>q.h[x][0]).join('')}</b></td>${(j+1)%5==0&&j<N-1?'</tr><tr>':''}`).join('')}</tr></table><p class="sub" style="margin:4px">Hijau = benar · Merah = salah · B/S, S/T, T/T = urutan kolom tiap pernyataan</p></div><h2>Pembahasan Setiap Soal</h2>`;
Q.forEach((q,j)=>{const g=ok(j);h+=`<div class="card rv ${g?'ok':'no'}"><span class="chip">Soal ${j+1} · ${q.k}</span> <b style="color:var(${g?'--ok':'--no'})">${g?'✔ Jawabanmu benar':'✘ Jawabanmu belum tepat'}</b><p>${q.q}</p>${q.fig?`<div class="fig">${q.fig}</div>`:''}<div class="${g?'key':'bad'}">Jawabanmu: ${txt(q,ans[j])}</div><div class="key"><b>Kunci jawaban:</b> ${key(q)}</div>${g?`<details><summary>Lihat langkah pengerjaan</summary>${sh(q.e)}</details>`:`<div class="exp"><b>📖 Cara mengerjakan, langkah demi langkah:</b>${sh(q.e)}<div class="st"><b>✓</b><span>Jadi jawabannya: <b>${key(q)}</b></span></div></div>`}</div>`});
A.innerHTML=h;scrollTo(0,0);rep={s,n}}
async function dl(f){const d=await (window.claude?claude.use('downloads'):null);const m=$('#dm');if(!d){m.textContent='Fitur unduh tidak tersedia di tampilan ini. Gunakan tombol cetak browser untuk menyimpan PDF.';return}
const nm=U.n.replace(/\W+/g,'_'),{s,n}=rep;let data,fn;
if(f=='csv'){fn='skor_'+nm+'.csv';data='Nama,Kelas,Asal Sekolah,Skor,Benar,Total\n'+[U.n,U.k,U.s].map(x=>'"'+x.replace(/"/g,'""')+'"').join(',')+`,${n},${s},${N}\n\nNo,Topik,Hasil,Jawaban Siswa,Kunci\n`+Q.map((q,j)=>[j+1,q.k,ok(j)?'Benar':'Salah',txt(q,ans[j]),key(q)].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n')}
else{fn='skor_'+nm+'.html';data=`<!DOCTYPE html><html lang="id"><meta charset="utf-8"><title>Skor ${esc(U.n)}</title><style>body{font:15px/1.5 sans-serif;max-width:760px;margin:auto;padding:16px}.k{border:1px solid #ccc;border-radius:10px;padding:10px;margin:10px 0}.o{border-left:5px solid #16a34a}.x{border-left:5px solid #dc2626}svg{max-width:100%}</style><h1>Hasil Try Out MTK Wajib 2</h1><p>Nama: <b>${esc(U.n)}</b><br>Kelas: ${esc(U.k)}<br>Sekolah: ${esc(U.s)}<br>Tanggal: ${new Date().toLocaleDateString('id-ID')}</p><h2>Skor: ${n} (benar ${s} dari ${N})</h2>`+Q.map((q,j)=>`<div class="k ${ok(j)?'o':'x'}"><b>Soal ${j+1} · ${q.k} — ${ok(j)?'Benar':'Salah'}</b><p>${q.q}</p>${q.fig?q.fig.replace(/<svg /,'<svg style="color:#000" '):''}<p>Jawabanmu: ${txt(q,ans[j])}<br><b>Kunci: ${key(q)}</b></p><p><b>Pembahasan:</b></p><ol>${stp(q.e).map(x=>'<li>'+x+'</li>').join('')}</ol></div>`).join('')+'</html>'}
try{await d.save({filename:fn,data});m.textContent='Berkas siap disimpan ✔'}catch(e){m.textContent=e.code=='declined'?'Unduhan dibatalkan.':'Gagal mengunduh ('+(e.code||'error')+').'}}
start();
</script></body></html>
